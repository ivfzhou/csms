worker_processes auto;
error_log        /var/log/nginx/error.log notice;
pid              /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include           /etc/nginx/mime.types;
    default_type      application/octet-stream;
    access_log        /var/log/nginx/access.log  main;
    sendfile          on;
    keepalive_timeout 65;

    # 外部服务。
    server {
        listen                    443 ssl;
        listen                    [::]:443 ssl;
        server_name               127.0.0.1;
        ssl_certificate           /etc/nginx/ssl/cert_csms_rsa.x509.pem;
        ssl_certificate_key       /etc/nginx/ssl/pkey_csms_rsa_2048.p8.pem;
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               TLS13-AES-256-GCM-SHA384:TLS13-CHACHA20-POLY1305-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        client_max_body_size      20m;

        location = /index.html {
            return 301 /frontend/index.html;
        }

        location = / {
            return 301 /frontend/index.html;
        }

        location /frontend/ {
            alias /home/ivfzhou/src/csms/website/dist/;
        }

        location /backend/ {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            proxy_set_header X-Date $http_x_date;
            proxy_set_header Date $http_date;
            proxy_pass http://backendToExternal/;
        }

        location / {
            return 404;
        }
    }

    # HTTP 到 HTTPS 重定向。
    server {
        listen               80;
        listen               [::]:80;
        server_name          127.0.0.1;
        client_max_body_size 20m;

        return 301 https://$server_name$request_uri;
    }

    # 内部服务。
    server {
        listen                     8000;
        listen                     [::]:8000;
        server_name                127.0.0.1;
        client_max_body_size       10G;
        proxy_pass_request_headers on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;

        location ^~ /backend/ {
            proxy_pass http://backendToInternal/;
        }

        location ^~ /fastlane_proxy/ {
            proxy_pass http://fastlane_proxy/;
        }

        location ^~ /hlk_manager/ {
            proxy_pass http://hlk_manager/;
        }
    }

    upstream backendToExternal {
        server 127.0.0.1:8090;
    }

    upstream backendToInternal {
        server 127.0.0.1:8091;
    }

    upstream fastlane_proxy {
        server 127.0.0.1:8092;
    }

    upstream hlk_manager {
        server 127.0.0.1:8093;
    }
}
